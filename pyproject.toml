[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contentworks"
version = "0.1.0"
description = "Turn source material into a checked series: split it, generate it, and hold every piece to a written set of rules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["content", "pipeline", "quality", "rules", "epub"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
contentworks = "contentworks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contentworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
