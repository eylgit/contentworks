name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check the shipped example actually works
        run: |
          mkdir -p ci-drafts
          printf 'Series: Episode 01 - Smoke Test\n\nA clean line of narration.\n' > ci-drafts/ep01.txt
          python -m contentworks.cli check ci-drafts --rules examples/podcastize-rules.yaml
